# The one site the browser sees in Docker: the Vue app, with /api passed on to Flask.
# It does in production what vite.config.js's proxy does during development.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Uploads (CSV, voice, photos) are up to 5 MB in Flask; nginx allows 1 MB unless told otherwise
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        # Replace, never append: a visitor can't fake their address to dodge daily limits (PROXY_COUNT=1 in Flask)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 150s;  # a picture preview can take 120 s
    }

    # Built files have a content hash in their names, so they can be cached for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Vue Router uses real paths (/products/SR-018): any unknown path gets the app, which shows the page
    location / {
        try_files $uri $uri/ /index.html;
    }
}
