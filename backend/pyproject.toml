[project]
name = "stylemate"
version = "0.1.0"
description = "StyleMate backend: an AI shopping assistant for online clothing stores"
readme = "README.md"
authors = [
    { name = "nusratamaisha", email = "nusratamaisha@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
